name = "possiblist-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[kv_namespaces]]
binding = "SESSIONS"
id = "placeholder-sessions-kv-id"
preview_id = "placeholder-sessions-kv-preview-id"

[vars]
ALLOWED_ORIGIN = "https://possiblist.io"

# Secrets — configure via `wrangler secret put <NAME>`:
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# STRIPE_PRICE_ANNUAL
# STRIPE_PRICE_MONTHLY
# RESEND_API_KEY
# RESEND_AUDIENCE_ID
