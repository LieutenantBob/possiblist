<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600&amp;family=Cormorant+Garamond:ital,wght@0,400;1,300&amp;family=Source+Serif+4:wght@400;600&amp;family=JetBrains+Mono:wght@300;400');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#F2EBD9"/>

  <!-- Subtle grain texture -->
  <filter id="grain">
    <feTurbulence baseFrequency="0.9" numOctaves="4" type="fractalNoise" result="noise"/>
    <feColorMatrix type="saturate" values="0" in="noise" result="mono"/>
    <feBlend in="SourceGraphic" in2="mono" mode="multiply" result="blend"/>
    <feComponentTransfer in="blend">
      <feFuncA type="linear" slope="0.03"/>
    </feComponentTransfer>
  </filter>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.3"/>

  <!-- Wordmark top-left -->
  <text x="60" y="55" font-family="'Cormorant SC', Georgia, serif" font-size="22" font-weight="600" fill="#1C1917">Possiblist</text>
  <text x="186" y="55" font-family="'Cormorant SC', Georgia, serif" font-size="22" font-weight="600" fill="#3D7A6E">°</text>

  <!-- Three glasses -->

  <!-- Glass 1: Pessimist (half empty) -->
  <g transform="translate(200, 180)">
    <!-- Glass outline -->
    <path d="M 0 0 L 10 180 L 110 180 L 120 0 Z" fill="none" stroke="#2C2520" stroke-width="2.5" opacity="0.6"/>
    <!-- Water level - bottom half -->
    <path d="M 55 90 L 60 180 L 110 180 L 115 90 Z" fill="#B85C38" opacity="0.2"/>
    <path d="M 55 90 L 115 90" stroke="#B85C38" stroke-width="1.5" opacity="0.5"/>
    <!-- Half-line marker -->
    <line x1="-15" y1="90" x2="0" y2="90" stroke="#8A8178" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="-20" y="94" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8A8178" text-anchor="end">50%</text>
  </g>

  <!-- Label: Pessimist -->
  <text x="260" y="400" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="400" fill="#B85C38" text-anchor="middle" letter-spacing="0.1em">PESSIMIST</text>
  <text x="260" y="425" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" fill="#8A8178" text-anchor="middle" font-style="italic">"Half empty."</text>

  <!-- Glass 2: Optimist (half full) -->
  <g transform="translate(500, 180)">
    <!-- Glass outline -->
    <path d="M 0 0 L 10 180 L 110 180 L 120 0 Z" fill="none" stroke="#2C2520" stroke-width="2.5" opacity="0.6"/>
    <!-- Water level - bottom half (same amount, different framing) -->
    <path d="M 55 90 L 60 180 L 110 180 L 115 90 Z" fill="#3D7A6E" opacity="0.15"/>
    <path d="M 55 90 L 115 90" stroke="#3D7A6E" stroke-width="1.5" opacity="0.5"/>
    <!-- Half-line marker -->
    <line x1="-15" y1="90" x2="0" y2="90" stroke="#8A8178" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="-20" y="94" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8A8178" text-anchor="end">50%</text>
  </g>

  <!-- Label: Optimist -->
  <text x="560" y="400" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="400" fill="#3D7A6E" text-anchor="middle" letter-spacing="0.1em">OPTIMIST</text>
  <text x="560" y="425" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" fill="#8A8178" text-anchor="middle" font-style="italic">"Half full."</text>

  <!-- Glass 3: Possiblist (with water pouring in) -->
  <g transform="translate(800, 180)">
    <!-- Glass outline -->
    <path d="M 0 0 L 10 180 L 110 180 L 120 0 Z" fill="none" stroke="#2C2520" stroke-width="2.5" opacity="0.6"/>
    <!-- Water level - rising, about 65% -->
    <path d="M 42 63 L 60 180 L 110 180 L 128 63 Z" fill="#3D7A6E" opacity="0.2"/>
    <path d="M 42 63 L 128 63" stroke="#3D7A6E" stroke-width="1.5" opacity="0.5"/>

    <!-- Pouring stream from above -->
    <path d="M 58 -30 Q 60 -10 60 10 Q 60 30 62 50 L 62 63" stroke="#3D7A6E" stroke-width="3" fill="none" opacity="0.4"/>
    <!-- Small splash droplets -->
    <circle cx="55" cy="58" r="2" fill="#3D7A6E" opacity="0.3"/>
    <circle cx="72" cy="55" r="1.5" fill="#3D7A6E" opacity="0.25"/>
    <circle cx="48" cy="52" r="1" fill="#3D7A6E" opacity="0.2"/>

    <!-- Arrow indicating rising level -->
    <line x1="135" y1="90" x2="135" y2="63" stroke="#C9963A" stroke-width="1.5"/>
    <polygon points="135,58 131,66 139,66" fill="#C9963A"/>
  </g>

  <!-- Label: Possiblist -->
  <text x="860" y="400" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="400" fill="#C9963A" text-anchor="middle" letter-spacing="0.1em">POSSIBLIST</text>
  <text x="860" y="425" font-family="'Cormorant Garamond', Georgia, serif" font-size="16" fill="#2C2520" text-anchor="middle" font-style="italic">"Refillable."</text>

  <!-- The line -->
  <text x="600" y="510" font-family="'Source Serif 4', Georgia, serif" font-size="17" font-weight="400" fill="#2C2520" text-anchor="middle">
    Pessimists see the glass as half empty. Optimists see it as half full.
  </text>
  <text x="600" y="538" font-family="'Source Serif 4', Georgia, serif" font-size="17" font-weight="600" fill="#3D7A6E" text-anchor="middle">
    Possibilists remember that it is refillable.
  </text>

  <!-- URL bottom right -->
  <text x="1140" y="600" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="300" fill="#8A8178" text-anchor="end">possiblist.net</text>
</svg>
